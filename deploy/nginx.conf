limit_req_zone $binary_remote_addr zone=client_api:10m rate=10r/s;

server {
    listen 80;
    limit_req_status 429;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    location ~ ^/api(?<user_path>/users(?:/.*)?)$ {
        limit_req zone=client_api;
        set $user_backend user-service:5001;
        proxy_pass http://$user_backend$user_path$is_args$args;
    }

    location ~ ^/api(?<order_path>/orders(?:/.*)?)$ {
        limit_req zone=client_api;
        set $order_backend order-service:5002;
        proxy_pass http://$order_backend$order_path$is_args$args;
    }

    location / {
        return 404;
    }
}

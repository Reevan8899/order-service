name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m pytest -v -m 'not integration' --cov=app --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: order-service
      - uses: actions/checkout@v5
        with:
          repository: Reevan8899/user-service
          path: user-service
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r order-service/requirements-dev.txt
      - name: Build and start both services with Docker Compose
        run: |
          printf 'include:\n  - ./order-service/docker-compose.yml\n' > docker-compose.yml
          docker compose up --build --wait --wait-timeout 90
          docker compose ps
      - name: Run live integration tests
        working-directory: order-service
        env:
          RUN_INTEGRATION: '1'
        run: python -m pytest -v -m integration
      - name: Verify requests, failure recovery, volumes and gateway
        run: bash order-service/deploy/verify.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the CI stack
        if: always()
        run: docker compose down --volumes

  publish:
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish Docker image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image:latest" -t "$image:sha-$GITHUB_SHA" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
